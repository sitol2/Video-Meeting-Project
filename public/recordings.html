<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorded Interviews</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/recordings.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Google+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar-container"></aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1>Recorded Interviews</h1>
                <div class="user-info">
                    <span id="user-name">Admin</span>
                </div>
            </header>

            <div class="recordings-dashboard">
                <div class="controls-header">
                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="search-recordings" placeholder="Search recordings...">
                    </div>
                    <div class="filters-wrapper">
                        <select id="filter-view">
                            <option value="active">Active Recordings</option>
                            <option value="archived">Archived Recordings</option>
                        </select>
                        <button id="toggle-filters-btn" class="icon-btn secondary" title="More Filters">
                            <span class="icon">⚙️</span>
                        </button>
                    </div>
                </div>

                <div id="advanced-filters" class="filter-panel" style="display: none;">
                    <div class="filter-group">
                        <label>Date Range</label>
                        <div class="date-inputs">
                            <input type="date" id="filter-start-date">
                            <span>to</span>
                            <input type="date" id="filter-end-date">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label>Sort By</label>
                        <select id="filter-sort">
                            <option value="created_desc">Newest First</option>
                            <option value="created_asc">Oldest First</option>
                            <option value="name_asc">Name (A-Z)</option>
                            <option value="name_desc">Name (Z-A)</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Transcript</label>
                        <select id="filter-transcript">
                            <option value="all">All</option>
                            <option value="true">Has Transcript</option>
                            <option value="false">No Transcript</option>
                        </select>
                    </div>
                    <button id="clear-filters-btn" class="icon-btn secondary" title="Clear Filters">
                        <span class="text">Clear</span>
                    </button>
                </div>

                <div id="recordings-container">
                    <!-- Recordings will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Transcript Modal -->
    <div id="transcript-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Transcript</h2>
            <div id="modal-transcript-content" class="transcript-text">Loading...</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/shared/navigation.js"></script>
    <script src="js/recordings.js"></script>
</body>

</html>
