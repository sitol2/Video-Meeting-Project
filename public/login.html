<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Google+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Interview</h1>
                <p class="login-subtitle">Sign in to continue</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="identifier">Student ID or Email</label>
                    <input type="text" id="identifier" class="form-input" placeholder="Enter your Student ID or Email"
                        required>
                    <p class="field-hint">You can use either your Student ID or Email to login</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••" required>
                </div>

                <p id="error-msg" class="error-msg"></p>

                <button type="submit" class="submit-btn" id="submit-btn">Sign in</button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
